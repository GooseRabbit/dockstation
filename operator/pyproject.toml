[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dockstation-operator"
version = "0.1.0"
description = "Read-only Windows operator client for the DockStation Linux diagnostic gateway"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
qml = ["PySide6>=6.8,<7"]

[project.gui-scripts]
dockstation-operator = "dockstation_operator.main:main"
dockstation-operator-qml = "dockstation_operator.qml_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "../verification/operator_app"]

[tool.setuptools.package-data]
dockstation_operator = ["ui/qml/*.qml"]
