name: Linux full verification

on:
  push:
    branches:
      - chore/flatten-repka-directories
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and CTest (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install OpenSSL development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Configure CMake
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DDOCKSTATION_ENABLE_SANITIZERS=ON

      - name: Build all Linux targets
        run: cmake --build build --parallel 2

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure

      - name: Verify Gateway systemd install package
        run: bash verification/repka_gateway/test_systemd_deployment.sh

      - name: Verify systemd unit and non-root Gateway startup
        run: |
          set -euo pipefail
          sudo groupadd --system dockstation
          sudo useradd --system --gid dockstation --no-create-home --home-dir /nonexistent --shell /usr/sbin/nologin dockstation
          sudo cmake --install build
          sudo install -d -o root -g dockstation -m 0750 /etc/dockstation
          sudo install -o root -g dockstation -m 0640 /usr/local/share/dockstation/gateway.conf.example /etc/dockstation/gateway.conf
          sudo systemd-analyze verify /usr/local/lib/systemd/system/dockstation-gateway.service
          sudo -u dockstation test -r /etc/dockstation/gateway.conf
          sudo -u dockstation test ! -w /etc/dockstation/gateway.conf
          sudo -u dockstation test ! -w /usr/local/bin/dockstation_linux_bootstrap
          command -v setpriv
          gateway_log="$RUNNER_TEMP/dockstation-gateway.log"
          sudo setpriv --reuid=dockstation --regid=dockstation --init-groups --no-new-privs -- /usr/local/bin/dockstation_linux_bootstrap --config-file /etc/dockstation/gateway.conf >"$gateway_log" 2>&1 &
          gateway_pid=$!
          cleanup_gateway() {
            if [[ -n "${gateway_pid:-}" ]] && sudo kill -0 "$gateway_pid" 2>/dev/null; then
              sudo kill -TERM "$gateway_pid"
              wait "$gateway_pid" || true
            fi
          }
          trap cleanup_gateway EXIT
          ready=false
          for attempt in {1..40}; do
            if curl -fsS --max-time 1 http://127.0.0.1:8080/api/v1/health | grep -Fq '"status":"PASS"'; then
              ready=true
              break
            fi
            if ! sudo kill -0 "$gateway_pid" 2>/dev/null; then
              break
            fi
            sleep 0.25
          done
          if [[ "$ready" != true ]]; then
            cat "$gateway_log"
            exit 1
          fi
          curl -fsS --max-time 10 http://127.0.0.1:8080/api/v1/system/diagnostics >/dev/null
          ss -ltn | grep -F '127.0.0.1:8080'
          sudo kill -TERM "$gateway_pid"
          wait "$gateway_pid"
          gateway_pid=""
          grep -Fq 'Локальный read-only API остановлен' "$gateway_log"

      - name: Run all 31 core and ConfigurationManager host tests
        run: bash tools/run_host_tests.sh

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install Python test runner
        run: python -m pip install --disable-pip-version-check pytest "PySide6>=6.8,<7"

      - name: Validate Operator QML package entry point
        run: |
          python -m pip install --disable-pip-version-check --no-deps -e "./operator[qml]"
          python -c "from importlib.metadata import entry_points; eps = {ep.name: ep.value for ep in entry_points(group='gui_scripts')}; assert eps.get('dockstation-operator-qml') == 'dockstation_operator.qml_app:main'"
          python -c "from importlib.resources import files; assert files('dockstation_operator').joinpath('ui/qml/Main.qml').is_file()"

      - name: Compile all Python modules and tests
        run: python -m compileall -q operator/src repka_gateway verification

      - name: Run Operator, Python Gateway and end-to-end integration tests
        env:
          PYTHONPATH: operator/src:.
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_CONTROLS_STYLE: Basic
        run: python -m pytest -q verification/operator_app verification/repka_gateway verification/integration

      - name: Check shell script syntax
        run: |
          find repka verification/repka_gateway -type f -name '*.sh' -print0 |
            xargs -0 -n1 bash -n

      - name: Run Repka network shell tests
        run: |
          for test_file in verification/repka_gateway/test_*.sh; do
            echo "=== $test_file ==="
            bash "$test_file"
          done
