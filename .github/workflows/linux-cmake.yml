name: Linux full verification

on:
  push:
    branches:
      - chore/flatten-repka-directories
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and CTest (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DDOCKSTATION_ENABLE_SANITIZERS=ON

      - name: Build all Linux targets
        run: cmake --build build --parallel 2

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure

      - name: Run all 31 core and ConfigurationManager host tests
        run: bash tools/run_host_tests.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install Python test runner
        run: python -m pip install --disable-pip-version-check pytest "PySide6>=6.8,<7"

      - name: Validate Operator QML package entry point
        run: |
          python -m pip install --disable-pip-version-check --no-deps -e "./operator[qml]"
          python -c "from importlib.metadata import entry_points; eps = {ep.name: ep.value for ep in entry_points(group='gui_scripts')}; assert eps.get('dockstation-operator-qml') == 'dockstation_operator.qml_app:main'"
          python -c "from importlib.resources import files; assert files('dockstation_operator').joinpath('ui/qml/Main.qml').is_file()"

      - name: Compile all Python modules and tests
        run: python -m compileall -q operator/src repka_gateway verification

      - name: Run Operator, Python Gateway and end-to-end integration tests
        env:
          PYTHONPATH: operator/src:.
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_CONTROLS_STYLE: Basic
        run: python -m pytest -q verification/operator_app verification/repka_gateway verification/integration

      - name: Check shell script syntax
        run: |
          find repka verification/repka_gateway -type f -name '*.sh' -print0 |
            xargs -0 -n1 bash -n

      - name: Run Repka network shell tests
        run: |
          for test_file in verification/repka_gateway/test_*.sh; do
            echo "=== $test_file ==="
            bash "$test_file"
          done
