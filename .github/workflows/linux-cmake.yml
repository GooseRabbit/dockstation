name: Linux CMake verification

on:
  push:
    branches:
      - chore/flatten-repka-directories
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and CTest (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DDOCKSTATION_ENABLE_SANITIZERS=ON

      - name: Build all Linux targets
        run: cmake --build build --parallel 2

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure
