name: Windows Operator installer

on:
  push:
    branches:
      - chore/flatten-repka-directories
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and verify Windows installer
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Operator and packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".\operator[qml]" pyinstaller

      - name: Build frozen QML application
        shell: pwsh
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed
          --name DockStationOperator
          --paths operator/src
          --collect-all PySide6
          --collect-all shiboken6
          --add-data "operator/src/dockstation_operator/ui/qml;dockstation_operator/ui/qml"
          packaging/windows/launcher.py

      - name: Verify frozen executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/DockStationOperator/DockStationOperator.exe")) {
            throw "Frozen Operator executable was not created."
          }

      # Packaging-only mode: runtime smoke and install/uninstall checks are intentionally deferred.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile Windows setup executable
        shell: pwsh
        run: |
          $version = "0.1.0+${{ github.sha }}".Substring(0, 18)
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "packaging/windows/DockStationOperator.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed."
          }
          $installer = Get-ChildItem "artifacts/DockStationOperator-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Windows setup executable was not created."
          }
          "INSTALLER_PATH=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: dockstation-operator-windows-x64-${{ github.sha }}
          path: artifacts/DockStationOperator-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
