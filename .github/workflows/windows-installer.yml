name: Windows Operator installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and verify Windows installer
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Operator and packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".\operator[qml]" pyinstaller

      - name: Build frozen QML application
        shell: pwsh
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed
          --name DockStationOperator
          --paths operator/src
          --collect-all PySide6
          --collect-all shiboken6
          --add-data "operator/src/dockstation_operator/ui/qml;dockstation_operator/ui/qml"
          packaging/windows/launcher.py

      - name: Verify frozen executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/DockStationOperator/DockStationOperator.exe")) {
            throw "Frozen Operator executable was not created."
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build two installer versions and verify install, upgrade, and uninstall
        shell: pwsh
        run: |
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $initialVersion = "0.0.9-ci"
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $upgradeVersion = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $upgradeVersion = "0.1.0+$($env:GITHUB_SHA.Substring(0, 12))"
          }

          & $compiler "/DAppVersion=$initialVersion" "packaging/windows/DockStationOperator.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Initial Inno Setup compilation failed."
          }
          & $compiler "/DAppVersion=$upgradeVersion" "packaging/windows/DockStationOperator.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Upgrade Inno Setup compilation failed."
          }

          $initialInstaller = "artifacts/DockStationOperator-Setup-$initialVersion.exe"
          $upgradeInstaller = "artifacts/DockStationOperator-Setup-$upgradeVersion.exe"
          foreach ($installer in @($initialInstaller, $upgradeInstaller)) {
            if (-not (Test-Path $installer)) {
              throw "Windows setup executable was not created: $installer"
            }
          }

          $installDir = Join-Path $env:RUNNER_TEMP "DockStationOperator-Install"
          $appDataDir = Join-Path $env:LOCALAPPDATA "DockStationOperator"
          $marker = Join-Path $appDataDir "ci-user-data-preservation-marker.txt"
          New-Item -ItemType Directory -Force -Path $appDataDir | Out-Null

          $install = Start-Process -FilePath $initialInstaller -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Initial Windows installation failed with exit code $($install.ExitCode)."
          }
          $appExe = Join-Path $installDir "DockStationOperator.exe"
          if (-not (Test-Path $appExe)) {
            throw "Initial installation did not create DockStationOperator.exe."
          }

          Set-Content -Path $marker -Value "preserve-me" -Encoding UTF8

          $upgrade = Start-Process -FilePath $upgradeInstaller -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir"
          ) -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) {
            throw "Windows upgrade failed with exit code $($upgrade.ExitCode)."
          }
          if (-not (Test-Path $appExe) -or (Get-Content $marker -Raw).Trim() -ne "preserve-me") {
            throw "Windows upgrade did not preserve the application or user data."
          }

          $smokeLog = Join-Path $env:RUNNER_TEMP "DockStationOperator-QML-smoke.log"
          $smoke = Start-Process -FilePath $appExe -ArgumentList @(
            "--smoke-test", "--smoke-test-log", $smokeLog
          ) -Wait -PassThru -NoNewWindow
          if ($smoke.ExitCode -ne 0) {
            throw "Installed QML Operator smoke test failed with exit code $($smoke.ExitCode)."
          }
          if (-not (Test-Path $smokeLog)) {
            throw "Packaged QML smoke test did not create its diagnostic log."
          }
          if (-not (Select-String -Path $smokeLog -Pattern "QML root objects loaded: [1-9]" -Quiet)) {
            Get-Content $smokeLog
            throw "Packaged QML root object was not loaded."
          }

          New-Item -ItemType Directory -Force -Path "artifacts/release" | Out-Null
          Copy-Item $upgradeInstaller "artifacts/release/"

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) {
            throw "Inno Setup uninstaller was not installed."
          }
          $remove = Start-Process -FilePath $uninstaller -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          ) -Wait -PassThru
          if ($remove.ExitCode -ne 0) {
            throw "Windows uninstall failed with exit code $($remove.ExitCode)."
          }
          if (Test-Path $installDir) {
            throw "Windows uninstall left application files behind."
          }
          if ((Get-Content $marker -Raw).Trim() -ne "preserve-me") {
            throw "Windows uninstall removed or changed user data."
          }

          Remove-Item -Force $marker
          if ((Get-ChildItem $appDataDir -Force | Measure-Object).Count -eq 0) {
            Remove-Item -Force $appDataDir
          }

      - name: Upload tested Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: dockstation-operator-windows-x64-${{ github.sha }}
          path: artifacts/release/*.exe
          if-no-files-found: error
          retention-days: 30

  publish-windows-release:
    name: Publish Windows installer to GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Download Windows installer artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: dockstation-operator-windows-x64-${{ github.sha }}
          path: ${{ runner.temp }}/dockstation-release

      - name: Wait for Linux release, then attach Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $deadline = (Get-Date).AddMinutes(50)
          $releaseFound = $false
          while ((Get-Date) -lt $deadline) {
            gh release view $env:RELEASE_TAG --repo $env:REPOSITORY *> $null
            if ($LASTEXITCODE -eq 0) {
              $releaseFound = $true
              break
            }
            Start-Sleep -Seconds 20
          }
          if (-not $releaseFound) {
            throw "Linux release $($env:RELEASE_TAG) was not created within 50 minutes."
          }

          $installer = Get-ChildItem "$env:RUNNER_TEMP/dockstation-release" -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer artifact does not contain an .exe file."
          }
          gh release upload $env:RELEASE_TAG $installer.FullName --repo $env:REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload Windows installer to GitHub Release."
          }

