name: Windows Operator installer

on:
  push:
    branches:
      - chore/flatten-repka-directories
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and verify Windows installer
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Operator and packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".\operator[qml]" pyinstaller

      - name: Build frozen QML application
        shell: pwsh
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed
          --name DockStationOperator
          --paths operator/src
          --collect-all PySide6
          --collect-all shiboken6
          --add-data "operator/src/dockstation_operator/ui/qml;dockstation_operator/ui/qml"
          packaging/windows/launcher.py

      - name: Verify frozen executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/DockStationOperator/DockStationOperator.exe")) {
            throw "Frozen Operator executable was not created."
          }

      # Packaging-only mode: runtime smoke and install/uninstall checks are intentionally deferred.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile Windows setup executable
        shell: pwsh
        run: |
          $version = "0.1.0+${{ github.sha }}".Substring(0, 18)
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "packaging/windows/DockStationOperator.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed."
          }
          $installer = Get-ChildItem "artifacts/DockStationOperator-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Windows setup executable was not created."
          }
          "INSTALLER_PATH=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: dockstation-operator-windows-x64-${{ github.sha }}
          path: artifacts/DockStationOperator-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

  publish-windows-release:
    name: Publish Windows installer to GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Download Windows installer artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: dockstation-operator-windows-x64-${{ github.sha }}
          path: ${{ runner.temp }}/dockstation-release

      - name: Wait for Linux release, then attach Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $deadline = (Get-Date).AddMinutes(50)
          $releaseFound = $false
          while ((Get-Date) -lt $deadline) {
            gh release view $env:RELEASE_TAG --repo $env:REPOSITORY *> $null
            if ($LASTEXITCODE -eq 0) {
              $releaseFound = $true
              break
            }
            Start-Sleep -Seconds 20
          }
          if (-not $releaseFound) {
            throw "Linux release $($env:RELEASE_TAG) was not created within 50 minutes."
          }

          $installer = Get-ChildItem "$env:RUNNER_TEMP/dockstation-release" -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer artifact does not contain an .exe file."
          }
          gh release upload $env:RELEASE_TAG $installer.FullName --repo $env:REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload Windows installer to GitHub Release."
          }

